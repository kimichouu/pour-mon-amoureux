<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pour mon amoureux ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #07120d;
      color: #f3efe2;
      font-family: "Montserrat", sans-serif;
      overflow-x: hidden;
    }

    /* ========================================
       PAGE D’ACCUEIL
    ======================================== */

    .hero {
      min-height: 100vh;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 80px 25px;

      background:
        linear-gradient(
          rgba(4, 15, 10, 0.68),
          rgba(4, 15, 10, 0.86)
        ),
        url("IMG_E3760.jpg");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      overflow: hidden;
    }

    .hero::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(95, 120, 87, 0.12),
          rgba(5, 16, 10, 0.72)
        );

      z-index: 0;
    }

    /* ========================================
       ÉTOILES
    ======================================== */

    .sparkle {
      position: absolute;

      color: #d7dfb9;

      opacity: 0.75;

      font-size: 23px;

      z-index: 1;

      animation: glow 3s ease-in-out infinite;
    }

    .sparkle.one {
      top: 7%;
      left: 8%;
    }

    .sparkle.two {
      top: 15%;
      right: 8%;

      animation-delay: 1s;
    }

    .sparkle.three {
      bottom: 12%;
      left: 12%;

      animation-delay: 1.8s;
    }

    .sparkle.four {
      right: 10%;
      bottom: 15%;

      animation-delay: 0.7s;
    }

    .sparkle.five {
      top: 50%;
      left: 4%;

      animation-delay: 1.3s;
    }

    .sparkle.six {
      top: 55%;
      right: 4%;

      animation-delay: 2s;
    }

    @keyframes glow {

      0%,
      100% {
        opacity: 0.35;

        transform: scale(1);
      }

      50% {
        opacity: 1;

        transform: scale(1.25);
      }
    }

    /* ========================================
       POLAROIDS
    ======================================== */

    .polaroid-wrap {
      position: absolute;

      width: 235px;
      height: 280px;

      z-index: 2;
    }

    .left-wrap {
      top: 5%;
      left: 4%;
    }

    .right-wrap {
      top: 6%;
      right: 4%;
    }

    .polaroid {
      position: absolute;

      width: 195px;

      padding: 10px 10px 38px;

      background: #eeeade;

      border:
        1px solid
        rgba(194, 213, 169, 0.22);

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.5);

      overflow: hidden;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .polaroid img {
      display: block;

      width: 100%;
      height: 195px;

      object-fit: cover;

      filter:
        sepia(16%)
        saturate(72%)
        hue-rotate(55deg)
        contrast(94%)
        brightness(88%);
    }

    .polaroid::after {
      content: "";

      position: absolute;

      inset: 10px 10px 38px;

      background:
        rgba(84, 111, 74, 0.24);

      mix-blend-mode: multiply;

      pointer-events: none;
    }

    .polaroid.left {
      top: 5px;
      left: 18px;

      transform: rotate(-7deg);
    }

    .polaroid.right {
      top: 5px;
      right: 18px;

      transform: rotate(6deg);
    }

    .polaroid:hover {
      transform:
        rotate(0deg)
        scale(1.06);

      box-shadow:
        0 20px 55px
        rgba(0, 0, 0, 0.65);
    }

    /* Scotch */

    .tape {
      position: absolute;

      top: -12px;
      left: 50%;

      width: 76px;
      height: 24px;

      background:
        rgba(159, 181, 138, 0.7);

      opacity: 0.82;

      transform:
        translateX(-50%)
        rotate(-3deg);

      z-index: 4;
    }

    /* Feuilles */

    .leaf {
      position: absolute;

      color: #9fb488;

      font-size: 52px;

      opacity: 0.8;

      z-index: 1;
    }

    .leaf-left-1 {
      left: -5px;
      bottom: 8px;

      transform: rotate(-28deg);
    }

    .leaf-left-2 {
      right: 6px;
      bottom: -2px;

      transform: rotate(155deg);
    }

    .leaf-right-1 {
      left: 4px;
      bottom: -2px;

      transform: rotate(-25deg);
    }

    .leaf-right-2 {
      right: -5px;
      bottom: 8px;

      transform: rotate(155deg);
    }

    /* Petits cœurs */

    .doodle-heart {
      position: absolute;

      color: #e5e8d1;

      font-family:
        "Great Vibes",
        cursive;

      font-size: 55px;

      z-index: 5;
    }

    .heart-left {
      right: -2px;
      bottom: 18px;

      transform: rotate(12deg);
    }

    .heart-right {
      left: -4px;
      bottom: 18px;

      transform: rotate(-15deg);
    }

    /* Étoiles autour des photos */

    .doodle-star {
      position: absolute;

      color: #d9e3b7;

      font-size: 28px;

      opacity: 0.85;

      z-index: 5;

      animation:
        glow 3s ease-in-out infinite;
    }

    .star-left {
      top: 28px;
      right: 5px;
    }

    .star-right {
      top: 24px;
      left: 5px;

      animation-delay: 1s;
    }

    /* ========================================
       CONTENU CENTRAL
    ======================================== */

    .content {
      position: relative;

      max-width: 680px;

      margin-top: 55px;

      text-align: center;

      z-index: 3;
    }

    .heart {
      margin-bottom: 10px;

      color: #dce7bc;

      font-size: 45px;

      text-shadow:
        0 0 18px
        rgba(190, 210, 150, 0.55);

      animation:
        heartBeat 2.6s infinite;
    }

    @keyframes heartBeat {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    .small-title {
      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(48px, 7vw, 78px);

      font-weight: 500;

      line-height: 0.95;

      text-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.55);
    }

    .age {
      margin-top: 18px;
      margin-bottom: 10px;

      color: #dce8bd;

      font-family:
        "Great Vibes",
        cursive;

      font-size:
        clamp(95px, 16vw, 165px);

      line-height: 0.9;

      text-shadow:
        0 0 25px
        rgba(183, 212, 138, 0.3);
    }

    .lover {
      margin-top: 0;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(46px, 6vw, 70px);

      font-weight: 500;
    }

    .date {
      display: inline-block;

      margin: 30px 0 24px;

      padding: 9px 25px;

      color: #f1eedf;

      background:
        rgba(91, 117, 75, 0.58);

      border:
        1px solid
        rgba(223, 230, 205, 0.3);

      border-radius: 5px;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 25px;

      letter-spacing: 2px;

      backdrop-filter: blur(5px);
    }

    .message {
      margin-bottom: 36px;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(22px, 3vw, 29px);

      line-height: 1.45;

      text-shadow:
        0 3px 15px
        rgba(0, 0, 0, 0.7);
    }

    /* ========================================
       BOUTON
    ======================================== */

    .enter {
      display: inline-block;

      width: auto;
      min-width: 330px;

      padding: 18px 40px;

      color: #f8f4e7;

      background:
        linear-gradient(
          135deg,
          rgba(68, 91, 58, 0.75),
          rgba(106, 129, 88, 0.55)
        );

      border:
        1px solid
        rgba(246, 243, 224, 0.8);

      border-radius: 999px;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 20px;

      letter-spacing: 7px;

      cursor: pointer;

      backdrop-filter: blur(8px);

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.3);

      transition: all 0.35s ease;
    }

    .enter:hover {
      color: #ffffff;

      background: #81956c;

      transform:
        translateY(-4px)
        scale(1.02);

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.45);
    }

    /* ========================================
       PAGE VIDE POUR LA SUITE
    ======================================== */

    .suite {
      min-height: 100vh;

      background:
        linear-gradient(
          #07120d,
          #0b1c13
        );
    }

    /* ========================================
       VERSION TÉLÉPHONE
    ======================================== */

    @media (max-width: 800px) {

      .hero {
        padding:
          165px
          22px
          70px;

        background-attachment: scroll;
        background-position: center;
      }

      .polaroid-wrap {
        width: 145px;
        height: 175px;
      }

      .left-wrap {
        top: 3%;
        left: 2%;
      }

      .right-wrap {
        top: 3%;
        right: 2%;
      }

      .polaroid {
        width: 120px;

        padding:
          7px
          7px
          26px;
      }

      .polaroid img {
        height: 115px;
      }

      .polaroid::after {
        inset:
          7px
          7px
          26px;
      }

      .polaroid.left {
        top: 3px;
        left: 10px;
      }

      .polaroid.right {
        top: 3px;
        right: 10px;
      }

      .tape {
        top: -9px;

        width: 50px;
        height: 17px;
      }

      .leaf {
        font-size: 30px;
      }

      .doodle-heart {
        font-size: 35px;
      }

      .doodle-star {
        font-size: 20px;
      }

      .content {
        margin-top: 35px;
      }

      .age {
        margin-top: 13px;
        margin-bottom: 8px;
      }

      .date {
        font-size: 19px;
      }

      .message {
        font-size: 22px;
      }

      .enter {
        width: 100%;
        max-width: 340px;
        min-width: 0;

        letter-spacing: 5px;
      }
    }

  </style>

</head>

<body>

  <!-- ========================================
       PAGE D’ACCUEIL
  ========================================= -->

  <section class="hero">

    <!-- Étoiles -->

    <span class="sparkle one">✧</span>
    <span class="sparkle two">✦</span>
    <span class="sparkle three">✧</span>
    <span class="sparkle four">✦</span>
    <span class="sparkle five">♡</span>
    <span class="sparkle six">✧</span>

    <!-- Polaroid gauche -->

    <div class="polaroid-wrap left-wrap">

      <span class="leaf leaf-left-1">❧</span>
      <span class="leaf leaf-left-2">❧</span>

      <span class="doodle-heart heart-left">♡</span>
      <span class="doodle-star star-left">✧</span>

      <div class="polaroid left">

        <div class="tape"></div>

        <img
          src="IMG_2528.jpg"
          alt="Photo de nous deux"
        >

      </div>

    </div>

    <!-- Polaroid droit -->

    <div class="polaroid-wrap right-wrap">

      <span class="leaf leaf-right-1">❧</span>
      <span class="leaf leaf-right-2">❧</span>

      <span class="doodle-heart heart-right">♡</span>
      <span class="doodle-star star-right">✧</span>

      <div class="polaroid right">

        <div class="tape"></div>

        <img
          src="IMG_5922.jpg"
          alt="Photo de nous deux"
        >

      </div>

    </div>

    <!-- Contenu central -->

    <div class="content">

      <div class="heart">
        ♡
      </div>

      <h1 class="small-title">
        Joyeux
      </h1>

      <div class="age">
        23 ans
      </div>

      <h2 class="lover">
        mon amoureux ♡
      </h2>

      <div class="date">
        ♡ 21 août 2026 ♡
      </div>

      <p class="message">

        J'aurais aimé être près de toi aujourd'hui.

        <br>

        Alors je t'ai préparé un endroit

        <br>

        où la distance n'existe pas.

      </p>

      <!--
        C’est maintenant un bouton et non un lien.
        Il ne peut donc plus ajouter #histoire
        dans l’adresse.
      -->

      <button
        class="enter"
        id="bouton-entrer"
        type="button"
      >
        ENTRE ICI ♡
      </button>

    </div>

  </section>

  <!-- ========================================
       PAGE VIDE
  ========================================= -->

  <section
    class="suite"
    id="suite"
  >
  </section>

  <script>

    /*
      Empêche le téléphone de restaurer
      l’ancienne position de la page.
    */

    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    /*
      Supprime l’ancien #histoire de l’adresse
      s’il est encore présent.
    */

    if (window.location.hash) {

      history.replaceState(
        null,
        "",
        window.location.pathname + window.location.search
      );

    }

    /*
      Force l’ouverture tout en haut.
    */

    function revenirEnHaut() {

      document.documentElement.style.scrollBehavior = "auto";

      window.scrollTo({
        top: 0,
        left: 0,
        behavior: "auto"
      });

      document.documentElement.style.scrollBehavior = "smooth";

    }

    window.addEventListener(
      "DOMContentLoaded",
      revenirEnHaut
    );

    window.addEventListener(
      "load",
      revenirEnHaut
    );

    window.addEventListener(
      "pageshow",
      revenirEnHaut
    );

    /*
      Au clic, le site descend vers la page vide.
    */

    const boutonEntrer =
      document.getElementById("bouton-entrer");

    boutonEntrer.addEventListener(
      "click",
      function () {

        document
          .getElementById("suite")
          .scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

      }
    );

  </script>

</body>

</html>
